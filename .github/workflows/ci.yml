name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      # Installs the pnpm version pinned in package.json's packageManager field. It must come before
      # setup-node, which runs pnpm to set up the dependency cache.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The gpu and sim vitest projects run in Chromium, so install it before the unit tests.
      - run: pnpm --filter @fumoca/app exec playwright install --with-deps chromium
      - run: pnpm typecheck
      - run: pnpm lint
      # pnpm has its own --reporter option, so call vitest directly to list every test.
      - run: pnpm exec vitest run --reporter=verbose
      - run: pnpm build
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: packages/app/playwright-report
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: app-dist
          path: packages/app/dist
          retention-days: 7

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-dist
          path: dist
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=fumoca-com --branch=main
